name: publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be published"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        id: publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python publish.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Record what was published
        if: always()
        run: |
          git config user.name "deckly-publisher"
          git config user.email "hola@decklyai.com"
          git add published.json
          git diff --cached --quiet || (git commit -m "published: $(date -u +%FT%RZ)" && git push)
      - name: Open an issue when a post fails
        if: failure() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            grep -E 'FAILED|SKIPPED' run.log | sed 's/^/    /'
          } > body.md
          open=$(gh issue list --state open --search "Publishing failed in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file body.md; else gh issue create --title "Publishing failed" --body-file body.md; fi
